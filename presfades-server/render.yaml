services:
  - type: web
    name: presfades-lead-api
    env: node
    plan: starter
    region: oregon
    branch: develop
    rootDir: presfades-server
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: presfades-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: S3_BUCKET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://presfades.example.com
      - key: TURNSTILE_SECRET
        sync: false
      - key: UPLOAD_TOKEN_SECRET
        sync: false
databases:
  - name: presfades-db
    databaseName: presfades
    plan: starter
    region: oregon
